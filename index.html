<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juan Medici | Sitio Oficial</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background:
    radial-gradient(circle at 50% 35%, #161513 0%, #090909 48%, #020202 100%);
  color: #e7ded2;
  font-family: Georgia, "Times New Roman", serif;
}

main {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
}

.content {
  width: 100%;
}

.official {
  font-family: Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 8px;
  color: #9d958a;
  margin-bottom: 55px;
}

h1 {
  margin: 0;
  font-weight: 400;
  font-size: clamp(52px, 12vw, 92px);
  line-height: .95;
  letter-spacing: 9px;
}

.line {
  width: 105px;
  height: 1px;
  background: #8a693a;
  margin: 55px auto;
}

.soon {
  font-family: Arial, sans-serif;
  font-size: 15px;
  letter-spacing: 9px;
  color: #b99863;
}

.socials {
  display: flex;
  justify-content: center;
  gap: 22px;
  margin-top: 75px;
}

.socials a {
  width: 52px;
  height: 52px;
  border: 1px solid #6d593e;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ded6cb;
  text-decoration: none;
  font-family: Arial, sans-serif;
  font-size: 14px;
  transition: .25s;
}

.socials a:hover {
  background: #b99863;
  color: #080808;
}

</style>
</head>

<body>

<main>
  <div class="content">

    <div class="official">SITIO OFICIAL</div>

    <h1>JUAN<br>MEDICI</h1>

    <div class="line"></div>

    <div class="soon">MUY PRONTO</div>

    <div class="socials">
      <a href="https://www.instagram.com/juan_medici"
         target="_blank"
         aria-label="Instagram">IG</a>

      <a href="https://youtube.com/@juanmedici"
         target="_blank"
         aria-label="YouTube">YT</a>

      <a href="https://www.tiktok.com/@juanmedici.com"
         target="_blank"
         aria-label="TikTok">TT</a>
    </div>

  </div>
</main>

</body>
</html>
